<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings · HCM Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="settings"><div id="app-shell"></div><main class="container-fluid page-wrap"><div class="page-heading"><div><div class="eyebrow">WORKSPACE</div><h1>Company settings</h1><p class="text-secondary mb-0">Set the rules used for attendance and leave.</p></div></div><div class="row g-4"><div class="col-12 col-lg-7"><div class="card app-card"><div class="card-body p-4"><form id="settings-form"><div class="mb-3"><label class="form-label" for="setting-company">Company name</label><input class="form-control" id="setting-company" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="office-start">Office start time</label><input class="form-control" id="office-start" type="time" required></div><div class="col-md-6 mb-3"><label class="form-label" for="grace-minutes">Grace period (minutes)</label><input class="form-control" id="grace-minutes" type="number" min="0" required></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="leave-quota">Yearly leave quota (days)</label><input class="form-control" id="leave-quota" type="number" min="0" required></div><div class="col-md-6 mb-3"><label class="form-label" for="work-days">Working days</label><select class="form-select" id="work-days"><option value="5">Monday–Friday</option><option value="6">Monday–Saturday</option><option value="7">Every day</option></select></div></div><div id="settings-message" role="status" class="small mb-3"></div><button class="btn btn-primary">Save settings</button></form></div></div></div><div class="col-12 col-lg-5"><div class="card app-card"><div class="card-body p-4"><h2 class="h5">Password</h2><p class="small text-secondary">Change the password for your current account.</p><form id="password-form"><div class="mb-3"><label class="form-label" for="current-password">Current password</label><input class="form-control" id="current-password" type="password" required></div><div class="mb-3"><label class="form-label" for="new-password">New password</label><input class="form-control" id="new-password" type="password" minlength="4" required></div><div id="password-message" role="status" class="small mb-3"></div><button class="btn btn-outline-primary">Change password</button></form></div></div></div></div></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
