<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employees · HCM Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="employees"><div id="app-shell"></div><main class="container-fluid page-wrap"><div class="page-heading"><div><div class="eyebrow">PEOPLE</div><h1>Employees</h1><p class="text-secondary mb-0">Manage your team and employee accounts.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employee-modal">＋ Add employee</button></div>
  <div class="card app-card"><div class="card-body p-4"><div class="row g-2 mb-3"><div class="col-md-7"><input id="employee-search" class="form-control" placeholder="Search by name or email"></div><div class="col-md-5"><select id="department-filter" class="form-select"><option value="">All departments</option></select></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Employee</th><th>Department</th><th>Email</th><th>Monthly salary</th><th></th></tr></thead><tbody id="employee-table"></tbody></table></div></div></div>
  </main><div class="modal fade" id="employee-modal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="employee-form"><div class="modal-header"><h2 class="modal-title fs-5" id="employee-modal-title">Add employee</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><input type="hidden" id="employee-id"><div class="mb-3"><label class="form-label" for="employee-name">Full name</label><input class="form-control" id="employee-name" required></div><div class="mb-3"><label class="form-label" for="employee-email">Email</label><input class="form-control" type="email" id="employee-email" required></div><div class="mb-3" id="employee-password-wrap"><label class="form-label" for="employee-password">Initial password</label><input class="form-control" id="employee-password" type="password" minlength="4" required></div><div class="mb-3"><label class="form-label" for="employee-department">Department</label><input class="form-control" id="employee-department" required></div><div class="mb-3"><label class="form-label" for="employee-salary">Monthly salary</label><input class="form-control" id="employee-salary" type="number" min="0.01" step="0.01" required></div><div class="form-error" id="employee-error" role="alert"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save employee</button></div></form></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
