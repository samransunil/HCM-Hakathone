<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard · HCM Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="admin"><div id="app-shell"></div><main class="container-fluid page-wrap"><div class="page-heading"><div><div class="eyebrow">OVERVIEW</div><h1>Dashboard</h1><p class="text-secondary mb-0">Here’s what’s happening at your company today.</p></div><span class="date-chip" id="today-label"></span></div>
  <div class="row g-3 mb-4" id="stat-cards"></div>
  <div class="row g-4"><section class="col-12 col-xl-7"><div class="card app-card h-100"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2 class="h5 mb-1">Today’s attendance</h2><p class="small text-secondary mb-0">Check-ins recorded for today</p></div><a href="employees.html" class="small text-decoration-none">View team →</a></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Employee</th><th>Department</th><th>Check-in</th><th>Status</th></tr></thead><tbody id="attendance-table"></tbody></table></div></div></div></section>
  <section class="col-12 col-xl-5"><div class="card app-card h-100"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h2 class="h5 mb-1">Leave requests</h2><p class="small text-secondary mb-0">Waiting for your review</p></div><a href="leaves.html" class="small text-decoration-none">All requests →</a></div><div id="pending-leaves"></div></div></div></section></div>
  <section class="card app-card mt-4"><div class="card-body p-4"><div class="eyebrow">SMART HELPER</div><h2 class="h5 mt-1">Ask about your team</h2><div id="helper-box" data-role="admin"></div></div></section>
  </main><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/helper.js"></script><script src="js/app.js"></script></body></html>
