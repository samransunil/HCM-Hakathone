<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My workspace · HCM Lite</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="employee"><div id="app-shell"></div><main class="container-fluid page-wrap"><div class="page-heading"><div><div class="eyebrow">MY WORKSPACE</div><h1 id="employee-greeting">Hello</h1><p class="text-secondary mb-0">Your attendance, time off, and payslip in one place.</p></div><span class="date-chip" id="today-label"></span></div><div class="row g-3 mb-4" id="employee-stats"></div>
  <div class="row g-4"><div class="col-12 col-xl-6"><div class="card app-card h-100"><div class="card-body p-4"><h2 class="h5">Today’s attendance</h2><p class="text-secondary small" id="attendance-status"></p><div class="d-flex gap-2"><button class="btn btn-primary" id="check-in">Check in</button><button class="btn btn-outline-primary" id="check-out">Check out</button></div><div class="small text-secondary mt-3" id="attendance-times"></div></div></div></div><div class="col-12 col-xl-6"><div class="card app-card"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center"><div><h2 class="h5 mb-1">Request time off</h2><p class="small text-secondary mb-3" id="leave-balance"></p></div></div><form id="leave-form"><div class="row g-2"><div class="col-sm-6"><label class="form-label" for="leave-from">From</label><input class="form-control" id="leave-from" type="date" required></div><div class="col-sm-6"><label class="form-label" for="leave-to">To</label><input class="form-control" id="leave-to" type="date" required></div><div class="col-sm-5"><label class="form-label" for="leave-type">Type</label><select class="form-select" id="leave-type"><option>Casual</option><option>Sick</option><option>Annual</option><option>Other</option></select></div><div class="col-sm-7"><label class="form-label" for="leave-reason">Reason</label><input class="form-control" id="leave-reason" required></div></div><div id="leave-message" class="form-error mt-2" role="alert"></div><button class="btn btn-primary mt-3">Submit request</button></form></div></div></div></div>
  <div class="row g-4 mt-1"><div class="col-12 col-lg-7"><div class="card app-card"><div class="card-body p-4"><h2 class="h5">Recent attendance</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Date</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead><tbody id="my-attendance"></tbody></table></div></div></div></div><div class="col-12 col-lg-5"><div class="card app-card"><div class="card-body p-4"><h2 class="h5">My leave requests</h2><div id="my-leaves"></div><a href="payslip.html" class="btn btn-outline-primary btn-sm mt-3">View payslip</a></div></div></div></div>
  <section class="card app-card mt-4"><div class="card-body p-4"><div class="eyebrow">SMART HELPER</div><h2 class="h5 mt-1">Ask about your work</h2><div id="helper-box" data-role="employee"></div></div></section></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/helper.js"></script><script src="js/app.js"></script></body></html>
